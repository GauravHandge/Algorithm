<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Practice Questions - AlgoVerse</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <link rel="stylesheet" href="/static/css/layout.css" />
  <link rel="stylesheet" href="/static/css/components.css" />
  <link rel="stylesheet" href="/static/css/responsive.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="/static/js/auth.js"></script>
</head>
<body style="background-color: #ffffff !important; color: #0f172a !important;">
  <header class="app-header">
    <a href="/static/index.html" class="brand-logo">
      <div class="brand-icon">
        <svg viewBox="0 0 32 32" fill="none">
          <path d="M16 2L3 28H10.5L16 16.5L21.5 28H29L16 2Z" fill="url(#brandGrad)" />
          <path d="M12.5 21H19.5L16 14L12.5 21Z" fill="#ffffff" opacity="0.9" />
          <defs>
            <linearGradient id="brandGrad" x1="3" y1="2" x2="29" y2="28" gradientUnits="userSpaceOnUse">
              <stop stop-color="#0052FF" />
              <stop offset="1" stop-color="#38BDF8" />
            </linearGradient>
          </defs>
        </svg>
      </div>
      <span>AlgoVerse</span>
    </a>

    <nav>
      <ul class="nav-links">
        <li><a href="/static/index.html">Home</a></li>
        <li><a href="/static/algorithms.html">Explore</a></li>
        <li><a href="/static/rag_visualizer.html" class="nav-rag-highlight"><span style="color:#0052ff;">✦</span> AI Visualizations</a></li>
        <li><a href="/static/practice.html" class="active">Practice</a></li>
        <li><a href="/static/quiz.html">Roadmaps</a></li>
        <li><a href="/static/dashboard.html">Resources</a></li>
      </ul>
    </nav>

    <div class="header-actions auth-nav-action">
      <button class="action-icon-btn" title="Search algorithms">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </button>
      <a href="/static/signin.html" class="btn btn-secondary" style="padding:0.45rem 1rem; font-size:0.85rem;">Sign In</a>
      <a href="/static/signin.html?mode=signup" class="btn btn-primary" style="padding:0.45rem 1.15rem; font-size:0.85rem;">Get Started</a>
    </div>
  </header>

  <main class="main-container">
    <div style="margin-bottom:2.5rem; text-align:center;">
      <div class="section-tag" style="justify-content:center;">INTERACTIVE PRACTICE QUESTIONS</div>
      <h1 style="font-size:2.5rem; font-weight:800; color:#0f172a; margin-bottom:0.5rem; letter-spacing:-0.03em;">
        Test Your <span style="color:#0052ff;">Mastery</span>
      </h1>
      <p style="color:#475569; font-size:1.05rem; max-width:640px; margin:0 auto;">Solve curated topic-wise problems with instant evaluation and feedback across core CS subjects.</p>
    </div>

    <!-- Questions Container -->
    <div id="questions-list" style="display:flex; flex-direction:column; gap:1.5rem; max-width:900px; margin:0 auto;">
      <!-- Dynamically rendered -->
    </div>
  </main>

  <script type="module">
    import { API } from '/static/js/api.js';

    async function loadPractice() {
      if (!AlgoAuth.requireAuth()) return;
      const container = document.getElementById("questions-list");
      try {
        const data = await API.getQuestions();
        if (data.success && data.questions.length > 0) {
          container.innerHTML = data.questions.map((q, idx) => `
            <div class="glass-panel" style="padding:1.75rem;">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
                <span class="badge badge-category">Question ${idx + 1}</span>
                <span class="badge badge-easy">${q.difficulty}</span>
              </div>
              <h3 style="font-size:1.15rem; margin-bottom:1.25rem;">${q.question_text}</h3>
              <div style="display:flex; flex-direction:column; gap:0.75rem; margin-bottom:1.25rem;">
                ${q.options ? q.options.map(opt => `
                  <button class="btn btn-secondary opt-btn" data-qid="${q.id}" data-opt="${opt}" style="justify-content:flex-start; text-align:left; padding:0.75rem 1.25rem;">
                    ${opt}
                  </button>
                `).join('') : ''}
              </div>
              <div id="result-${q.id}" style="display:none; padding:1rem; border-radius:8px; font-size:0.95rem;"></div>
            </div>
          `).join('');

          // Option click listener
          document.querySelectorAll('.opt-btn').forEach(btn => {
            btn.addEventListener('click', async (e) => {
              const qid = btn.getAttribute('data-qid');
              const opt = btn.getAttribute('data-opt');
              const resBox = document.getElementById(`result-${qid}`);

              // Submit answer
              const subRes = await API.submitQuiz(null, { [qid]: opt });
              if (subRes.details && subRes.details.length > 0) {
                const detail = subRes.details[0];
                resBox.style.display = 'block';
                if (detail.correct) {
                  resBox.style.background = 'rgba(16,185,129,0.15)';
                  resBox.style.border = '1px solid #10b981';
                  resBox.style.color = '#34d399';
                  resBox.innerHTML = `<strong>✓ Correct!</strong> ${detail.explanation || ''}`;
                } else {
                  resBox.style.background = 'rgba(239,68,68,0.15)';
                  resBox.style.border = '1px solid #ef4444';
                  resBox.style.color = '#f87171';
                  resBox.innerHTML = `<strong>✗ Incorrect.</strong> Correct answer: <strong>${detail.correct_answer}</strong>. ${detail.explanation || ''}`;
                }
              }
            });
          });
        }
      } catch (e) {
        console.error("Practice load error:", e);
      }
    }

    loadPractice();
  </script>
</body>
</html>
