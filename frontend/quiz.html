<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assessment Quizzes - AlgoVerse</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <link rel="stylesheet" href="/static/css/layout.css" />
  <link rel="stylesheet" href="/static/css/components.css" />
  <link rel="stylesheet" href="/static/css/responsive.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body style="background-color: #ffffff !important; color: #0f172a !important;">
  <header class="app-header">
    <a href="/static/index.html" class="brand-logo">
      <div class="brand-icon">
        <svg viewBox="0 0 32 32" fill="none">
          <path d="M16 2L3 28H10.5L16 16.5L21.5 28H29L16 2Z" fill="url(#brandGrad)" />
          <path d="M12.5 21H19.5L16 14L12.5 21Z" fill="#ffffff" opacity="0.9" />
          <defs>
            <linearGradient id="brandGrad" x1="3" y1="2" x2="29" y2="28" gradientUnits="userSpaceOnUse">
              <stop stop-color="#0052FF" />
              <stop offset="1" stop-color="#38BDF8" />
            </linearGradient>
          </defs>
        </svg>
      </div>
      <span>AlgoVerse</span>
    </a>

    <nav>
      <ul class="nav-links">
        <li><a href="/static/index.html">Home</a></li>
        <li><a href="/static/algorithms.html">Explore</a></li>
        <li><a href="/static/rag_visualizer.html" class="nav-rag-highlight"><span style="color:#0052ff;">✦</span> AI Visualizations</a></li>
        <li><a href="/static/practice.html">Practice</a></li>
        <li><a href="/static/quiz.html" class="active">Roadmaps</a></li>
        <li><a href="/static/dashboard.html">Resources</a></li>
      </ul>
    </nav>

    <div class="header-actions">
      <button class="action-icon-btn" title="Search algorithms">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </button>
      <a href="/static/dashboard.html" class="btn btn-secondary" style="padding:0.45rem 1rem; font-size:0.85rem;">Sign In</a>
      <a href="/static/algorithms.html" class="btn btn-primary" style="padding:0.45rem 1.15rem; font-size:0.85rem;">Get Started</a>
    </div>
  </header>

  <main class="main-container">
    <div style="margin-bottom:2.5rem; text-align:center;">
      <div class="section-tag" style="justify-content:center;">COMPREHENSIVE EVALUATION</div>
      <h1 style="font-size:2.5rem; font-weight:800; color:#0f172a; margin-bottom:0.5rem; letter-spacing:-0.03em;">
        Subject Assessment <span style="color:#0052ff;">Quizzes</span>
      </h1>
      <p style="color:#475569; font-size:1.05rem; max-width:640px; margin:0 auto;">Answer timed questions to test your overall Computer Science mastery and earn certificates.</p>
    </div>

    <!-- Quiz Form -->
    <div class="glass-panel" style="max-width:800px; margin:0 auto; padding:2rem;">
      <form id="quiz-form">
        <div id="quiz-questions-container" style="display:flex; flex-direction:column; gap:2rem;">
          <!-- Dynamically loaded -->
        </div>

        <div style="margin-top:2rem; border-top:1px solid var(--border-color); padding-top:1.5rem; text-align:right;">
          <button type="submit" class="btn btn-primary" style="font-size:1rem; padding:0.75rem 2rem;">Submit Quiz</button>
        </div>
      </form>

      <div id="quiz-result-card" style="display:none; margin-top:2rem; padding:1.5rem; border-radius:12px; background:rgba(99,102,241,0.15); border:1px solid var(--accent-primary); text-align:center;">
        <h2 style="color:var(--accent-secondary); margin-bottom:0.5rem;">Quiz Summary</h2>
        <div id="quiz-score-text" style="font-size:1.8rem; font-weight:bold; margin-bottom:1rem;"></div>
        <a href="/static/dashboard.html" class="btn btn-primary">View Full Dashboard →</a>
      </div>
    </div>
  </main>

  <script type="module">
    import { API } from '/static/js/api.js';

    let loadedQuestions = [];

    async function initQuiz() {
      const container = document.getElementById("quiz-questions-container");
      try {
        const data = await API.getQuestions(null, null);
        if (data.success && data.questions.length > 0) {
          loadedQuestions = data.questions;
          container.innerHTML = loadedQuestions.map((q, idx) => `
            <div>
              <h3 style="font-size:1.1rem; margin-bottom:1rem;">${idx + 1}. ${q.question_text}</h3>
              <div style="display:flex; flex-direction:column; gap:0.5rem;">
                ${q.options.map(opt => `
                  <label style="display:flex; align-items:center; gap:0.75rem; background:rgba(0,0,0,0.2); padding:0.65rem 1rem; border-radius:8px; cursor:pointer;">
                    <input type="radio" name="q_${q.id}" value="${opt}" required />
                    <span>${opt}</span>
                  </label>
                `).join('')}
              </div>
            </div>
          `).join('');
        }
      } catch (e) {
        console.error("Quiz init error:", e);
      }
    }

    document.getElementById("quiz-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const answers = {};
      loadedQuestions.forEach(q => {
        const selected = document.querySelector(`input[name="q_${q.id}"]:checked`);
        if (selected) answers[q.id] = selected.value;
      });

      try {
        const res = await API.submitQuiz("all", answers);
        const card = document.getElementById("quiz-result-card");
        const scoreText = document.getElementById("quiz-score-text");
        card.style.display = "block";
        scoreText.textContent = `Score: ${res.score} / ${res.total} (${res.percentage}%)`;
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
      } catch (e) {
        console.error("Quiz submit error:", e);
      }
    });

    initQuiz();
  </script>
</body>
</html>
